name: CI

# The merge gate for main. Branch protection requires the `check` job to pass before a PR can
# merge (see docs/git-flow.md). Coolify deploys main on every push, so whatever reaches main
# has already been through this.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # A throwaway PostgreSQL that exists only for this job. The tests never see a real database.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: tidewatch_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d tidewatch_ci_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/tidewatch_ci_test
      # No keys, no Telegram: nothing in CI can reach Binance or send an alert.
      BINANCE_TESTNET: "true"
      DRY_RUN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --python 3.12 --frozen
      - run: uv run --frozen ruff check .
      # Migrate the throwaway database (the app reads DATABASE_URL), then check the models
      # and the migrations agree.
      - run: uv run --frozen alembic upgrade head
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: uv run --frozen alembic check
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      # CI=true makes the database tests fail instead of skip when the database is missing.
      - run: uv run --frozen pytest -q -rs
